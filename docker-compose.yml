services:
  pintoshop-backend:
    build: .
    command: bash -c scripts/entrypoint.sh
    restart: always
    container_name: pintoshop-backend
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
  db:
    image: postgres:16
    ports:
      - 5555:5432
    restart: always
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:6.2-alpine
    ports:
      - 6666:6379
    restart: always
    volumes:
      - redis_data:/data

  pintoshop-celery:
    build: .
    command: celery -A Ecommerce worker --loglevel=info
    container_name: pintoshop-celery
    depends_on:
      - pintoshop-backend
      - redis
    volumes:
      - .:/app
  pintoshop-celery-beat:
    build: .
    command: celery -A Ecommerce beat --loglevel=info
    container_name: pintoshop-celery-beat
    depends_on:
      - pintoshop-backend
      - redis
    volumes:
      - .:/app
  pintoshop-flower:
    build: .
    command: celery --broker="${BROKER_URL}" flower --port=5555
    container_name: pintoshop-flower
    depends_on:
      - pintoshop-celery
      - redis
    ports:
      - 5050:5555

volumes:
  postgres_data:
  redis_data:
